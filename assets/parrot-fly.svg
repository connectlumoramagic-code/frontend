<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A rose-ringed parakeet in flight, facing left, wings flapping. -->
  <style>
    .wing { transform-origin: 29px 33px; animation: flap 0.34s ease-in-out infinite; }
    .wing--back { animation-delay: -0.04s; }
    @keyframes flap {
      0%, 100% { transform: scaleY(1); }
      50%      { transform: scaleY(-0.55); }
    }
  </style>
  <path class="wing wing--back" d="M27 33 C29 19 39 10 50 9 C45 15 40 23 35 33 Z" fill="#2F7A2A"/>
  <path d="M40 34 L63 42 L61 45 L38 38 Z" fill="#3F7A2A"/>
  <path d="M40 35.5 L60 47 L58 49 L38 39.5 Z" fill="#2E8B57"/>
  <ellipse cx="30" cy="35" rx="13" ry="7" transform="rotate(-10 30 35)" fill="#5DBB3F"/>
  <ellipse cx="28" cy="38" rx="9" ry="3.3" transform="rotate(-10 28 38)" fill="#8BD86A" opacity="0.75"/>
  <circle cx="16" cy="29" r="7" fill="#6CC24A"/>
  <path d="M18 36 C21 34 23 30 22.5 25" fill="none" stroke="#1F3A24" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M19.3 36.4 C22.4 34.3 24.3 30.3 23.9 25" fill="none" stroke="#E88BA0" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M10.5 26.5 C5.5 26.5 3.5 31 5.5 35 C6.5 32 8.5 31 10.5 32 Z" fill="#D8322A"/>
  <path d="M9 32.2 C8 33.2 8.2 34.4 9.6 34.7 L11 33 Z" fill="#9E1F1A"/>
  <circle cx="14.5" cy="27.5" r="1.8" fill="#FFF7D6"/>
  <circle cx="14.2" cy="27.5" r="1" fill="#1F2A1F"/>
  <g class="wing">
    <path d="M25 34 C27 17 39 6 55 6 C48 13 42 22 36 34 Z" fill="#4CA83A"/>
    <path d="M55 6 C50 10 46.5 14 43.5 19.5 L47.5 18.5 C50.5 13.5 52.5 9.5 55 6 Z" fill="#2E6FA0"/>
    <path d="M30 31 C33 22 39 15 46 12" fill="none" stroke="#3F7A2A" stroke-width="0.8" opacity="0.6"/>
  </g>
</svg>
