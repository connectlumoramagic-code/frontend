<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The same parakeet perched, facing left; it tilts its head now and then
       and gives a small wing shuffle. Feet rest on y = 50. -->
  <style>
    .head { transform-origin: 25px 27px; animation: tilt 4.5s ease-in-out infinite; }
    .wing { transform-origin: 30px 28px; animation: shuffle 4.5s ease-in-out 1.2s infinite; }
    @keyframes tilt {
      0%, 60%, 100% { transform: rotate(0deg); }
      68%, 80%      { transform: rotate(-14deg); }
      88%           { transform: rotate(5deg); }
    }
    @keyframes shuffle {
      0%, 88%, 100% { transform: rotate(0deg); }
      92%           { transform: rotate(-12deg); }
      96%           { transform: rotate(3deg); }
    }
  </style>
  <path d="M31 40 L37 63 L34 64 L28 41 Z" fill="#3F7A2A"/>
  <path d="M28.5 41 L31.5 62 L28.5 62.5 L25.5 42 Z" fill="#2E8B57"/>
  <ellipse cx="28" cy="36" rx="8" ry="13" transform="rotate(14 28 36)" fill="#5DBB3F"/>
  <ellipse cx="25.5" cy="38" rx="4" ry="9" transform="rotate(14 25.5 38)" fill="#8BD86A" opacity="0.75"/>
  <g class="wing">
    <ellipse cx="31.5" cy="37" rx="5" ry="11.5" transform="rotate(16 31.5 37)" fill="#3F9A2E"/>
    <path d="M31 44 C33 46 34.5 48.5 35 51 C32.5 49.5 30.8 47.5 30 45 Z" fill="#2E6FA0"/>
  </g>
  <path d="M24 49 L22 51.5 M24 49 L26 51.5 M28.5 49.5 L27.5 52 M28.5 49.5 L30.5 52" stroke="#B98A7A" stroke-width="1.5" stroke-linecap="round"/>
  <g class="head">
    <circle cx="22" cy="21" r="7" fill="#6CC24A"/>
    <path d="M24 28.5 C27 27.3 29 24 28.8 19" fill="none" stroke="#1F3A24" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M25.2 29.2 C28.4 27.8 30.2 24.3 30 19" fill="none" stroke="#E88BA0" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M16.5 18.5 C11.5 18.5 9.5 23 11.5 27 C12.5 24 14.5 23 16.5 24 Z" fill="#D8322A"/>
    <path d="M15 24.2 C14 25.2 14.2 26.4 15.6 26.7 L17 25 Z" fill="#9E1F1A"/>
    <circle cx="20.5" cy="19.5" r="1.8" fill="#FFF7D6"/>
    <circle cx="20.2" cy="19.5" r="1" fill="#1F2A1F"/>
  </g>
</svg>
