<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The same butterfly resting: its wings open and close slowly now and then. -->
  <style>
    .wings { transform-origin: 32px 34px; animation: rest 4s ease-in-out infinite; }
    @keyframes rest {
      0%, 45%, 100% { transform: scaleX(1); }
      60%, 68%      { transform: scaleX(0.22); }
      82%           { transform: scaleX(1); }
    }
  </style>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9DBFF"/>
      <stop offset="0.55" stop-color="#4A9BE8"/>
      <stop offset="1" stop-color="#1E5BB8"/>
    </linearGradient>
    <g id="wing">
      <path d="M33 31 C38 16 52 9 58.5 15 C63 21 57 30 34 34 Z" fill="url(#blue)" stroke="#14305E" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M33 35 C49 34 57 41 53 49 C49.5 56 39 51 33 39 Z" fill="url(#blue)" stroke="#14305E" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M40 27 C45 21 50 18 55 17" fill="none" stroke="#14305E" stroke-width="0.8" opacity="0.55"/>
      <circle cx="53.5" cy="18.5" r="2.2" fill="#FFFFFF"/>
      <circle cx="49" cy="45" r="1.9" fill="#FFFFFF"/>
      <circle cx="44" cy="41" r="1.2" fill="#14305E"/>
    </g>
  </defs>
  <g class="wings">
    <use href="#wing"/>
    <use href="#wing" transform="translate(64 0) scale(-1 1)"/>
  </g>
  <path d="M31.2 24 C29.5 18 27 14.5 24 13 M32.8 24 C34.5 18 37 14.5 40 13" fill="none" stroke="#14305E" stroke-width="1" stroke-linecap="round"/>
  <circle cx="24" cy="13" r="1.2" fill="#14305E"/>
  <circle cx="40" cy="13" r="1.2" fill="#14305E"/>
  <ellipse cx="32" cy="36" rx="1.9" ry="10" fill="#14305E"/>
  <circle cx="32" cy="25" r="2.5" fill="#14305E"/>
</svg>
